name: App Android

on:
  push:
    paths:
      - "ruta-magdalena/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar la APK
        run: gradle -p android assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Preparar la descarga
        run: cp android/app/build/outputs/apk/debug/app-debug.apk camino-magdalena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: camino-magdalena-apk
          path: camino-magdalena.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          target_commitish: ${{ github.sha }}
          name: Camí de la Magdalena · app Android
          make_latest: true
          files: camino-magdalena.apk
          body: |
            Descarga **camino-magdalena.apk** en el móvil Android y ábrela.
            La primera vez Android pedirá permiso para instalar apps de origen desconocido.

            Compilación ${{ github.run_number }} · commit ${{ github.sha }}
