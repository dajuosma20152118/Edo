# Publicación en Netlify: esta carpeta se sirve tal cual, sin compilación.
[build]
  publish = "."

# El service worker siempre fresco, para que las actualizaciones lleguen al móvil
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
